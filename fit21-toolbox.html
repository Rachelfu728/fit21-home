<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的維持期百寶箱 🧺 ｜ 遇見喜樂</title>
<meta property="og:title" content="我的維持期百寶箱 🧺">
<meta property="og:description" content="你需要的時候，工具都在這裡。想用隨時來拿 💚">
<meta property="og:type" content="website">
<style>
  :root{
    --ink:#2f3d2a;--moss:#5a7a3f;--leaf:#7fa653;--leaf-light:#a3c47a;
    --gold:#c9a24b;--gold-soft:#e8d3a0;--cream:#f6f4ea;--paper:#fffdf7;
    --clay:#c97b52;--line:#dfe6cf;--mist:rgba(127,166,83,.12);
    --shadow:rgba(90,122,63,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);line-height:1.7;
    background:
      radial-gradient(circle at 15% 6%, #eaf3dd 0%, transparent 40%),
      radial-gradient(circle at 88% 96%, #dcebc6 0%, transparent 46%),
      linear-gradient(160deg, #f4f8ec 0%, #eaf2db 100%);
    min-height:100vh;padding:30px 18px 50px;max-width:520px;margin:0 auto;
  }

  .head{text-align:center;margin-bottom:8px;}
  .kicker{font-size:12px;letter-spacing:.26em;color:var(--gold);font-weight:700;margin-bottom:10px;}
  .basket{font-size:52px;line-height:1;margin-bottom:10px;display:inline-block;animation:sway 5s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
  h1{font-size:26px;font-weight:800;color:var(--ink);margin-bottom:12px;letter-spacing:.02em;}
  .intro{
    font-size:15px;color:var(--moss);max-width:340px;margin:0 auto 6px;line-height:1.8;
  }
  .addr{font-size:11px;color:#a59a7e;margin:16px 0 30px;text-align:center;}

  /* 工具清單 */
  .tools{display:flex;flex-direction:column;gap:16px;}
  .tool{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;
    background:var(--paper);border:1px solid var(--line);border-radius:20px;
    padding:18px 18px;box-shadow:0 8px 22px var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease;position:relative;overflow:hidden;
  }
  .tool::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--leaf);
  }
  .tool:hover,.tool:active{transform:translateY(-3px);box-shadow:0 14px 30px var(--shadow);}
  .tool .ic{
    flex-shrink:0;width:58px;height:58px;border-radius:16px;
    background:linear-gradient(135deg,#eaf3dd,#dcebc6);
    display:flex;align-items:center;justify-content:center;font-size:30px;
  }
  .tool .body{flex:1;min-width:0;}
  .tool .name{font-size:17.5px;font-weight:800;color:var(--ink);margin-bottom:3px;}
  .tool .desc{font-size:13.5px;color:#7d8a6c;line-height:1.6;}
  .tool .go{
    flex-shrink:0;color:var(--leaf);font-size:22px;font-weight:700;
  }

  /* 即將登場（灰階佔位，讓她期待） */
  .tool.soon{opacity:.62;box-shadow:none;background:#f3f2e9;cursor:default;pointer-events:none;}
  .tool.soon::before{background:#cbceb8;}
  .tool.soon .ic{background:#e9e8dc;filter:grayscale(.4);}
  .tool.soon .badge{
    font-size:11px;color:#a59a7e;font-weight:700;border:1px solid #d8d5bf;
    border-radius:20px;padding:3px 10px;white-space:nowrap;
  }

  .section-label{
    font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:800;
    margin:30px 0 14px;padding-left:4px;
  }

  .foot{margin-top:38px;text-align:center;}
  .foot .line{width:44px;height:2px;background:var(--gold-soft);margin:0 auto 18px;border-radius:2px;}
  .foot .msg{font-size:14px;color:var(--moss);line-height:1.8;max-width:320px;margin:0 auto 22px;}
  .foot .brand{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.16em;margin-bottom:3px;}
  .foot .tag{font-size:11px;color:#a59a7e;letter-spacing:.1em;}

  @media (prefers-reduced-motion: reduce){.basket{animation:none;}}
  @media(max-width:380px){h1{font-size:23px;}.tool .ic{width:52px;height:52px;font-size:26px;}}
</style>
</head>
<body>

  <div class="head">
    <div class="kicker">FIT21 · 維持期</div>
    <div class="basket">🧺</div>
    <h1>我的維持期百寶箱</h1>
    <p class="intro">你已經學會照顧自己了。<br>需要的時候，工具都在這裡——<br>想用，隨時來拿 💚</p>
  </div>
  <div class="addr">遇見喜樂營養俱樂部 ｜ 台中市北區進化北路367-6號 大衛營商場一樓</div>

  <div class="section-label">🌿 現在就能用</div>
  <div class="tools">

    <!-- ▼▼▼ 一個工具一格。要加新工具，複製這整塊 <a>...</a>，改 emoji、名字、說明、網址即可 ▼▼▼ -->
    <a class="tool" href="https://rachelfu728.github.io/fit21-home/fit21-craving-rescue.html?v=1">
      <div class="ic">🌿</div>
      <div class="body">
        <div class="name">嘴饞自救包</div>
        <div class="desc">突然很想吃東西？點我，抽一張自救卡，陪你撐過那一陣風。</div>
      </div>
      <div class="go">›</div>
    </a>

    <a class="tool" href="https://rachelfu728.github.io/fit21-home/fit21-recipes.html?v=1">
      <div class="ic">🥗</div>
      <div class="body">
        <div class="name">健康食譜牆</div>
        <div class="desc">好好吃飯也能瘦。食譜會一直更新，想煮什麼隨時來逛。</div>
      </div>
      <div class="go">›</div>
    </a>
    <!-- ▲▲▲ 複製到這裡為止 ▲▲▲ -->

  </div>

  <div class="section-label">🌱 陸續為你準備中</div>
  <div class="tools">

    <!-- 即將登場：先放灰階佔位，讓她期待。做好後把它改成上面那種正式的 <a> 就好 -->
    <div class="tool soon">
      <div class="ic">🚨</div>
      <div class="body">
        <div class="name">復胖警報急救包</div>
        <div class="desc">體重回升有點慌？先別急，這裡陪你穩下來。</div>
      </div>
      <div class="badge">即將登場</div>
    </div>

  </div>

  <div class="foot">
    <div class="line"></div>
    <p class="msg">維持不是靠意志力硬撐，<br>是身邊隨時有能幫你的工具。<br>這個百寶箱，會一直陪著你。</p>
    <div class="brand">遇見喜樂營養俱樂部</div>
    <div class="tag">好好吃飯也能瘦</div>
  </div>

</body>
</html>
