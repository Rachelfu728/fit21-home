<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喜樂集點卡 ｜ Fit21 Step 2</title>
<meta property="og:title" content="喜樂集點卡 ｜ Fit21 Step 2">
<meta property="og:description" content="每天動一點，21 天一起突破平台期！三擇一打卡，集滿解鎖喜樂小禮 💚">
<meta property="og:image" content="https://rachelfu728.github.io/fit21-home/step2-card.png?v=1">
<meta property="og:type" content="website">
<meta property="og:image:width" content="1122">
<meta property="og:image:height" content="1402">
<style>
  :root{
    --ink:#2f3d2a;          /* 深橄欖綠，主要文字 */
    --moss:#5a7a3f;         /* 苔綠，重點色 */
    --leaf:#7fa653;         /* 葉綠，達標色 */
    --gold:#c9a24b;         /* 溫潤金，里程碑 */
    --gold-soft:#e8d3a0;    /* 淺金 */
    --cream:#f7f3e8;        /* 奶油底 */
    --cream-deep:#efe7d3;   /* 深一階奶油 */
    --paper:#fffdf7;        /* 卡片紙白 */
    --clay:#c97b52;         /* 暖陶土，點綴 */
    --line:#ded2b4;
    --shadow:rgba(90,122,63,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:
      radial-gradient(circle at 12% 8%, #fbf7ec 0%, transparent 45%),
      radial-gradient(circle at 88% 92%, #f0ead6 0%, transparent 50%),
      var(--cream);
    color:var(--ink);
    line-height:1.7;
    padding:22px 16px 60px;
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
  }

  /* ---------- 頁首 ---------- */
  .kicker{
    font-size:13px;letter-spacing:.22em;color:var(--gold);
    font-weight:700;text-align:center;margin-bottom:6px;
  }
  h1{
    font-size:29px;font-weight:800;color:var(--ink);
    text-align:center;letter-spacing:.03em;
  }
  .subtitle{
    text-align:center;color:var(--moss);font-size:15px;
    margin-top:8px;font-weight:500;
  }
  .store{
    text-align:center;font-size:11.5px;color:#a89b78;
    margin-top:12px;line-height:1.6;
  }

  /* ---------- 連續天數儀表 ---------- */
  .streak{
    margin:26px 0 20px;
    background:linear-gradient(150deg,var(--moss),var(--leaf));
    border-radius:24px;
    padding:26px 24px;
    color:#fff;
    text-align:center;
    box-shadow:0 12px 30px var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .streak::after{
    content:"";position:absolute;right:-30px;top:-30px;
    width:130px;height:130px;border-radius:50%;
    background:rgba(255,255,255,.09);
  }
  .streak::before{
    content:"";position:absolute;left:-24px;bottom:-40px;
    width:110px;height:110px;border-radius:50%;
    background:rgba(255,255,255,.07);
  }
  .streak-label{font-size:13px;letter-spacing:.16em;opacity:.9;}
  .streak-num{
    font-size:60px;font-weight:900;line-height:1.05;
    margin:2px 0;position:relative;z-index:1;
  }
  .streak-unit{font-size:18px;font-weight:600;}
  .streak-sub{
    font-size:13.5px;opacity:.95;margin-top:6px;position:relative;z-index:1;
  }
  .streak-stats{
    display:flex;justify-content:center;gap:0;
    margin-top:18px;position:relative;z-index:1;
  }
  .stat{flex:1;}
  .stat-n{font-size:24px;font-weight:800;}
  .stat-l{font-size:11.5px;opacity:.9;letter-spacing:.05em;}
  .stat-divider{width:1px;background:rgba(255,255,255,.28);margin:2px 0;}

  /* ---------- 進度條 ---------- */
  .progress-wrap{margin:0 4px 24px;}
  .progress-top{
    display:flex;justify-content:space-between;
    font-size:12.5px;color:var(--moss);font-weight:600;margin-bottom:7px;
  }
  .progress-bar{
    height:12px;background:var(--cream-deep);border-radius:20px;overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.06);
  }
  .progress-fill{
    height:100%;border-radius:20px;
    background:linear-gradient(90deg,var(--leaf),var(--gold));
    width:0%;transition:width .6s cubic-bezier(.22,1,.36,1);
  }

  /* ---------- 21 格 ---------- */
  .grid-title{
    display:flex;align-items:center;gap:10px;
    font-size:15px;font-weight:700;color:var(--ink);
    margin:0 4px 14px;
  }
  .grid-title::before,.grid-title::after{
    content:"";flex:1;height:1px;background:var(--line);
  }
  .grid-title span{padding:0 4px;}
  .grid{
    display:grid;grid-template-columns:repeat(7,1fr);gap:9px;
    margin-bottom:8px;
  }
  .cell{
    aspect-ratio:1;border-radius:14px;
    background:var(--paper);
    border:1.5px solid var(--line);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    cursor:pointer;position:relative;
    transition:transform .18s ease, box-shadow .2s ease;
    user-select:none;
  }
  .cell:active{transform:scale(.92);}
  .cell .daynum{font-size:11px;color:#b3a884;font-weight:600;}
  .cell .mark{font-size:22px;line-height:1;margin-top:1px;}
  /* 里程碑格（第7、14、21天）*/
  .cell.milestone{border-color:var(--gold-soft);background:#fdf8ec;}
  .cell.milestone .daynum{color:var(--gold);}
  /* 已達標 */
  .cell.done{
    background:linear-gradient(150deg,var(--leaf),var(--moss));
    border-color:var(--moss);
    box-shadow:0 5px 14px var(--shadow);
  }
  .cell.done .daynum{color:rgba(255,255,255,.8);}
  .cell.done .mark{color:#fff;}
  .cell.done.milestone{
    background:linear-gradient(150deg,var(--gold),#b8862f);
    border-color:var(--gold);
  }
  /* 今天 */
  .cell.today{
    border-color:var(--clay);border-width:2px;
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(201,123,82,.35);}
    50%{box-shadow:0 0 0 6px rgba(201,123,82,0);}
  }
  .legend{
    display:flex;justify-content:center;gap:16px;flex-wrap:wrap;
    font-size:11.5px;color:#a89b78;margin:10px 0 4px;
  }
  .legend i{
    display:inline-block;width:11px;height:11px;border-radius:4px;
    vertical-align:-1px;margin-right:4px;
  }

  /* ---------- 解鎖區 ---------- */
  .unlocks{margin-top:26px;}
  .unlock{
    background:var(--paper);border:1.5px solid var(--line);
    border-radius:16px;padding:15px 17px;margin-bottom:12px;
    display:flex;align-items:center;gap:14px;
    transition:all .3s ease;
  }
  .unlock.open{
    border-color:var(--gold);
    background:linear-gradient(120deg,#fdf8ec,#fbf3df);
    box-shadow:0 6px 16px rgba(201,162,75,.14);
  }
  .unlock-icon{
    font-size:26px;width:44px;height:44px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--cream-deep);border-radius:12px;
  }
  .unlock.open .unlock-icon{background:var(--gold-soft);}
  .unlock-body{flex:1;}
  .unlock-title{font-size:14.5px;font-weight:700;color:var(--ink);}
  .unlock-desc{font-size:12.5px;color:#8a7f5f;margin-top:2px;}
  .unlock.locked .unlock-title,
  .unlock.locked .unlock-desc{color:#bcb191;}

  /* ---------- 回報按鈕 ---------- */
  .report-btn{
    display:block;width:100%;margin-top:24px;
    background:linear-gradient(135deg,var(--clay),#b3673f);
    color:#fff;border:none;border-radius:16px;
    padding:16px;font-size:16px;font-weight:700;
    cursor:pointer;font-family:inherit;
    box-shadow:0 8px 20px rgba(201,123,82,.28);
    transition:transform .15s ease;
  }
  .report-btn:active{transform:scale(.97);}
  .reset-btn{
    display:block;margin:16px auto 0;background:none;border:none;
    color:#b3a884;font-size:12px;cursor:pointer;
    text-decoration:underline;font-family:inherit;
  }

  .footer-tag{
    text-align:center;margin-top:34px;
    font-size:13px;color:var(--gold);letter-spacing:.12em;font-weight:600;
  }

  /* ---------- 達標選單彈窗 ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(47,61,42,.45);
    display:none;align-items:flex-end;justify-content:center;
    z-index:50;padding:0;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--cream);width:100%;max-width:520px;
    border-radius:24px 24px 0 0;padding:24px 22px 30px;
    animation:slideUp .3s cubic-bezier(.22,1,.36,1);
  }
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet h3{font-size:18px;color:var(--ink);text-align:center;}
  .sheet p{font-size:13px;color:var(--moss);text-align:center;margin:6px 0 18px;}
  .task{
    display:flex;align-items:center;gap:13px;
    background:var(--paper);border:1.5px solid var(--line);
    border-radius:14px;padding:14px 16px;margin-bottom:10px;
    cursor:pointer;transition:all .15s ease;
  }
  .task:active{transform:scale(.98);}
  .task.sel{border-color:var(--leaf);background:#f2f7ea;}
  .task-emoji{font-size:22px;}
  .task-text{flex:1;font-size:14.5px;font-weight:600;color:var(--ink);}
  .task-share{display:block;font-size:11.5px;font-weight:500;color:#a89b78;margin-top:3px;}
  .task-check{
    width:22px;height:22px;border-radius:50%;
    border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:13px;
  }
  .task.sel .task-check{background:var(--leaf);border-color:var(--leaf);}
  .sheet-confirm{
    width:100%;margin-top:8px;background:var(--moss);color:#fff;
    border:none;border-radius:14px;padding:15px;font-size:15.5px;
    font-weight:700;cursor:pointer;font-family:inherit;
  }
  .sheet-confirm:disabled{background:#c3c0ad;}
  .sheet-cancel{
    width:100%;margin-top:8px;background:none;border:none;
    color:#a89b78;font-size:13px;cursor:pointer;font-family:inherit;padding:8px;
  }

  /* ---------- toast ---------- */
  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:13px 22px;border-radius:30px;
    font-size:14px;font-weight:600;opacity:0;pointer-events:none;
    transition:all .3s ease;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

  <div class="kicker">FIT21 · STEP 2 · 代謝進階</div>
  <h1>喜樂集點卡</h1>
  <div class="subtitle">每天動一點、拍下來傳給教練<br>21 天，我們一起突破平台期 💚</div>
  <div class="store">遇見喜樂營養俱樂部 ｜ 好好吃飯也能瘦<br>台中市北區進化北路367-6號 大衛營商場一樓</div>

  <!-- 連續天數 -->
  <div class="streak">
    <div class="streak-label">目前連續</div>
    <div class="streak-num"><span id="streakNum">0</span><span class="streak-unit"> 天</span></div>
    <div class="streak-sub" id="streakMsg">今天，就是最好的開始 🌱</div>
    <div class="streak-stats">
      <div class="stat"><div class="stat-n" id="totalDone">0</div><div class="stat-l">累積達標</div></div>
      <div class="stat-divider"></div>
      <div class="stat"><div class="stat-n" id="bestStreak">0</div><div class="stat-l">最長連續</div></div>
      <div class="stat-divider"></div>
      <div class="stat"><div class="stat-n" id="remainDays">21</div><div class="stat-l">還剩天數</div></div>
    </div>
  </div>

  <!-- 進度 -->
  <div class="progress-wrap">
    <div class="progress-top"><span>Step 2 旅程進度</span><span id="progressPct">0%</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <!-- 21 格 -->
  <div class="grid-title"><span>點一下今天的格子，記下你的堅持</span></div>
  <div class="grid" id="grid"></div>
  <div class="legend">
    <span><i style="background:var(--leaf)"></i>已達標</span>
    <span><i style="background:var(--gold)"></i>里程碑（7/14/21天）</span>
    <span><i style="background:#fff;border:1.5px solid var(--clay)"></i>今天</span>
  </div>

  <!-- 解鎖 -->
  <div class="grid-title" style="margin-top:28px"><span>集滿解鎖的喜樂驚喜</span></div>
  <div class="unlocks" id="unlocks"></div>

  <!-- 回報 -->
  <button class="report-btn" onclick="copyReport()">📋 複製我的進度，回報給教練</button>
  <button class="reset-btn" onclick="resetCard()">重新開始這張卡</button>

  <div class="footer-tag">— 遇見喜樂 —</div>

  <!-- 達標彈窗 -->
  <div class="overlay" id="overlay">
    <div class="sheet">
      <h3 id="sheetTitle">第 1 天 · 今天你做到了什麼？</h3>
      <p>三擇一，做到任一項、傳給教練，今天就達標 💚</p>
      <div id="taskList"></div>
      <button class="sheet-confirm" id="sheetConfirm" onclick="confirmDay()" disabled>蓋下今天的章</button>
      <button class="sheet-cancel" onclick="closeSheet()">先不要</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* ---------------- 資料設定 ---------------- */
const TOTAL_DAYS = 21;
const MILESTONES = [7,14,21];

const TASKS = [
  {emoji:"🚶", text:"走路約 30 分鐘", share:"拍一張外出走路的照片，分享給教練 📸"},
  {emoji:"🌿", text:"平甩功 5 分鐘", share:"錄一段影片，傳給教練 🎥"},
  {emoji:"⚡", text:"殭屍操 3 分鐘", share:"錄一段影片，傳給教練 🎥"},
];

const UNLOCKS = [
  {day:7,  icon:"🎧", title:"達標 7 天 · 教練的悄悄話", desc:"解鎖一段教練為你錄的鼓勵語音＋群組小表揚"},
  {day:14, icon:"🍱", title:"達標 14 天 · 喜樂加碼禮", desc:"解鎖一份專屬食譜／小贈品，你已經走了一半！"},
  {day:21, icon:"🎁", title:"達標 21 天 · 突破里程碑", desc:"完成 Step 2！回店領取你的喜樂小禮＋完成祝福"},
];

const STORE_KEY = "fit21_step2_card_v1";

/* ---------------- 狀態 ---------------- */
let state = load();

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { days:{}, current:1 }; // days[dayNum] = {task:"文字"}
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

/* ---------------- 計算 ---------------- */
function doneCount(){ return Object.keys(state.days).length; }
function currentStreak(){
  // 從最大已完成天往回數連續
  let streak=0;
  const doneDays = Object.keys(state.days).map(Number).sort((a,b)=>a-b);
  if(doneDays.length===0) return 0;
  const maxDay = Math.max(...doneDays);
  for(let d=maxDay; d>=1; d--){
    if(state.days[d]) streak++; else break;
  }
  return streak;
}
function bestStreak(){
  let best=0,run=0;
  for(let d=1; d<=TOTAL_DAYS; d++){
    if(state.days[d]){run++; best=Math.max(best,run);} else run=0;
  }
  return best;
}
function nextOpenDay(){
  for(let d=1; d<=TOTAL_DAYS; d++){ if(!state.days[d]) return d; }
  return TOTAL_DAYS;
}

/* ---------------- 畫面 ---------------- */
function render(){
  const done = doneCount();
  const streak = currentStreak();

  document.getElementById("streakNum").textContent = streak;
  document.getElementById("totalDone").textContent = done;
  document.getElementById("bestStreak").textContent = bestStreak();
  document.getElementById("remainDays").textContent = TOTAL_DAYS - done;

  // 連續天鼓勵語
  const msgEl = document.getElementById("streakMsg");
  if(done===0) msgEl.textContent = "今天，就是最好的開始 🌱";
  else if(streak>=14) msgEl.textContent = "你已經是自己的榜樣了 ✨";
  else if(streak>=7) msgEl.textContent = "連續一週！身體正在改變 💪";
  else if(streak>=3) msgEl.textContent = "很棒，別讓連續斷掉喔 🔥";
  else msgEl.textContent = "每一天的堅持都算數 💚";

  // 進度
  const pct = Math.round(done/TOTAL_DAYS*100);
  document.getElementById("progressPct").textContent = pct+"%";
  document.getElementById("progressFill").style.width = pct+"%";

  // 格子
  const grid = document.getElementById("grid");
  grid.innerHTML="";
  const todayDay = nextOpenDay();
  for(let d=1; d<=TOTAL_DAYS; d++){
    const cell=document.createElement("div");
    cell.className="cell";
    if(MILESTONES.includes(d)) cell.classList.add("milestone");
    if(state.days[d]) cell.classList.add("done");
    if(d===todayDay && !state.days[d]) cell.classList.add("today");

    const isMile=MILESTONES.includes(d);
    const mark = state.days[d] ? (isMile?"🏆":"✓") : (isMile?"⭐":"");
    cell.innerHTML=`<span class="daynum">Day ${d}</span><span class="mark">${mark}</span>`;
    cell.onclick=()=>openSheet(d);
    grid.appendChild(cell);
  }

  // 解鎖
  const uWrap=document.getElementById("unlocks");
  uWrap.innerHTML="";
  UNLOCKS.forEach(u=>{
    const open = done>=u.day; // 累積達標數達到門檻即解鎖
    const el=document.createElement("div");
    el.className="unlock "+(open?"open":"locked");
    el.innerHTML=`
      <div class="unlock-icon">${open?u.icon:"🔒"}</div>
      <div class="unlock-body">
        <div class="unlock-title">${u.title}</div>
        <div class="unlock-desc">${open?u.desc:"再累積達標即可解鎖"}</div>
      </div>`;
    uWrap.appendChild(el);
  });
}

/* ---------------- 彈窗 ---------------- */
let pendingDay=null, pendingTask=null;
function openSheet(day){
  pendingDay=day; pendingTask=null;
  document.getElementById("sheetTitle").textContent = `第 ${day} 天 · 今天你做到了什麼？`;
  const list=document.getElementById("taskList");
  list.innerHTML="";
  const already = state.days[day];
  TASKS.forEach(t=>{
    const el=document.createElement("div");
    el.className="task"+(already && already.task===t.text ? " sel":"");
    if(already && already.task===t.text) pendingTask=t.text;
    el.innerHTML=`<span class="task-emoji">${t.emoji}</span>
      <span class="task-text">${t.text}<span class="task-share">${t.share}</span></span>
      <span class="task-check">✓</span>`;
    el.onclick=()=>{
      document.querySelectorAll("#taskList .task").forEach(x=>x.classList.remove("sel"));
      el.classList.add("sel");
      pendingTask=t.text;
      document.getElementById("sheetConfirm").disabled=false;
    };
    list.appendChild(el);
  });
  document.getElementById("sheetConfirm").disabled = !pendingTask;
  // 若已完成，允許取消打勾
  const confirmBtn=document.getElementById("sheetConfirm");
  confirmBtn.textContent = already ? "更新今天的章" : "蓋下今天的章";
  document.getElementById("overlay").classList.add("show");
}
function closeSheet(){
  document.getElementById("overlay").classList.remove("show");
}
function confirmDay(){
  if(!pendingDay || !pendingTask) return;
  const wasDone = !!state.days[pendingDay];
  state.days[pendingDay] = {task:pendingTask};
  if(pendingDay===state.current) state.current=nextOpenDay();
  save();
  closeSheet();
  render();
  // 里程碑慶祝
  const done=doneCount();
  if(!wasDone && MILESTONES.includes(done)){
    showToast(`🎉 太棒了！達標 ${done} 天，解鎖新驚喜！`);
  }else if(!wasDone){
    showToast("💚 今天的章蓋好了，繼續加油！");
  }else{
    showToast("已更新今天的紀錄");
  }
}

/* ---------------- 回報 ---------------- */
function copyReport(){
  const done=doneCount();
  const streak=currentStreak();
  const best=bestStreak();
  let lines=[];
  lines.push("🌿 我的 Fit21 Step 2 集點回報");
  lines.push("───────────");
  lines.push(`✅ 累積達標：${done} / 21 天`);
  lines.push(`🔥 目前連續：${streak} 天`);
  lines.push(`🏆 最長連續：${best} 天`);
  lines.push(`📊 旅程進度：${Math.round(done/TOTAL_DAYS*100)}%`);
  // 解鎖狀態
  const opened=UNLOCKS.filter(u=>done>=u.day).map(u=>u.title.split("·")[1].trim());
  if(opened.length) lines.push(`🎁 已解鎖：${opened.join("、")}`);
  lines.push("───────────");
  lines.push("好好吃飯也能瘦 · 遇見喜樂 💛");
  const text=lines.join("\n");

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      showToast("📋 已複製！貼到 LINE 傳給教練吧");
    }).catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text; document.body.appendChild(ta); ta.select();
  try{document.execCommand("copy"); showToast("📋 已複製！貼到 LINE 傳給教練吧");}
  catch(e){showToast("請長按選取文字複製");}
  document.body.removeChild(ta);
}

function resetCard(){
  if(confirm("確定要重新開始這張卡嗎？目前的紀錄會清除。")){
    state={days:{},current:1};
    save(); render();
    showToast("已重新開始，加油！");
  }
}

/* ---------------- toast ---------------- */
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}

/* 點背景關閉彈窗 */
document.getElementById("overlay").addEventListener("click",e=>{
  if(e.target.id==="overlay") closeSheet();
});

render();
</script>
